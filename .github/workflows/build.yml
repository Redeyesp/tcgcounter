# ============================================================================
#  Build & publish firmware
#
#  push to main      -> build, keep firmware as a workflow artifact,
#                       update the web flasher on GitHub Pages
#  pull request      -> build only (catches compile errors before merging)
#  tag vX.Y.Z        -> build + GitHub Release with the firmware files
#                       (tag must equal FW_VERSION in TCGCounter/Config.h)
#  manual (on main)  -> Actions tab -> "Build & publish firmware" -> Run workflow
#                       (same as a push: build + web flasher)
#
#  One-time repo setting: Settings -> Pages -> Source: "GitHub Actions".
# ============================================================================
name: Build & publish firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (PlatformIO, env cyd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO toolchain and libraries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO and esptool
        run: pip install --upgrade platformio "esptool>=5,<6"

      - name: Build firmware
        run: pio run -e cyd

      - name: Package firmware and web flasher
        run: bash scripts/package_firmware.sh cyd

      - name: Upload firmware files
        uses: actions/upload-artifact@v7
        with:
          name: TCGCounter-firmware
          path: dist/
          if-no-files-found: error

      - name: Upload web flasher site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  pages:
    name: Deploy web flasher (GitHub Pages)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TCGCounter-firmware
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
