; ============================================================================
;  TCG Counter — Firmware V0.1  (ESP32-2432S028R "Cheap Yellow Display")
;
;  The source lives in TCGCounter/ so the SAME folder also opens directly in
;  the Arduino IDE (TCGCounter/TCGCounter.ino). Pins are NOT set here —
;  all GPIO numbers are in TCGCounter/Config.h.
; ============================================================================

[platformio]
src_dir      = TCGCounter
default_envs = cyd

[env:cyd]
platform        = espressif32 @ ^6.9.0      ; official platform -> Arduino-ESP32 core 2.0.x
board           = esp32dev                  ; the CYD is a plain ESP32-WROOM-32, 4 MB flash
framework       = arduino

lib_deps        = lovyan03/LovyanGFX @ ^1.2.0

upload_speed    = 921600                    ; drop to 460800 or 115200 if uploads fail
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

build_flags     = -D CORE_DEBUG_LEVEL=1     ; ESP-IDF errors only; app logs: DEBUG_LOG in Config.h
